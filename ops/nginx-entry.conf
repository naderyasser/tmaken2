# masar.base.meena.sa = shared entry for every HR client copy (2026-10-16).
# The sign-in screens let the visitor type a company code; /company-select (Next)
# stores it in the `mt_company` cookie and this map turns it into the Frappe
# site. Codes come from /etc/nginx/hr-companies.map (ops/sync-company-map.sh);
# no/unknown cookie = the masar demo, as before. Previous config:
# /root/nginx-backups/masar.conf.2026-10-16-pre-entry
map $cookie_mt_company $mt_site {
    default masar;
    include /etc/nginx/hr-companies.map;
}


# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name masar.base.meena.sa;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # ADMS / ZKTeco terminals speak plain HTTP only - they have no SSL stack and
    # silently stop pushing punches when handed a 301. This MUST stay above the
    # redirect below (same block as qarawi.conf).
    location ^~ /iclock/ {
        rewrite ^/iclock/cdata(.*)$ /api/method/base_meena.biometric_management.adms.cdata$1 break;
        rewrite ^/iclock/getrequest(.*)$ /api/method/base_meena.biometric_management.adms.getrequest$1 break;
        rewrite ^/iclock/devicecmd(.*)$ /api/method/base_meena.biometric_management.adms.devicecmd$1 break;
        proxy_pass http://frappe-priority;
        proxy_http_version 1.1;
        proxy_set_header X-Frappe-Site-Name masar;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — shared entry: the company code (cookie mt_company) picks the site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name masar.base.meena.sa;

    root /home/frappeuser/frappe-dev/sites;

    ssl_certificate /etc/letsencrypt/live/masar.base.meena.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masar.base.meena.sa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin";

    # Shared HR frontend; the site header tells it which client this is
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header X-Frappe-Site-Name $mt_site;
        proxy_set_header X-Masar-Entry 1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Next.js API proxy route — must come BEFORE the general /api/ block
    location /api/frappe {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header X-Frappe-Site-Name $mt_site;
        proxy_set_header X-Masar-Entry 1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Frappe API routes
    location /api/ {
        proxy_pass http://frappe-priority;
        proxy_http_version 1.1;
        proxy_set_header X-Frappe-Site-Name $mt_site;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # HRMS employee PWA (Frappe-served Vue app at /hrms)
    location /hrms {
        proxy_pass http://frappe-priority;
        proxy_http_version 1.1;
        proxy_set_header X-Frappe-Site-Name $mt_site;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Frappe print view
    location /printview {
        proxy_pass http://frappe-priority;
        proxy_http_version 1.1;
        proxy_set_header X-Frappe-Site-Name $mt_site;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Frappe Socket.IO
    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name $mt_site;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header Host $host;
        proxy_pass http://frappe-dev-socketio-server;
    }

    # Frappe public files — gunicorn does not serve /files, nginx must (same as qarawi.conf)
    location /files/ {
        root /home/frappeuser/frappe-dev/sites/$mt_site/public;
        try_files $uri =404;
    }

    location /private/files/ {
        proxy_pass http://frappe-priority;
        proxy_http_version 1.1;
        proxy_set_header X-Frappe-Site-Name $mt_site;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frappe assets
    location /assets {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000";
    }

    # Per-tenant branding logos — served from the dedicated frontend
    location /branding/ {
        alias /home/frappeuser/frappe-dev/tamken3-frontend/public/branding/;
        expires 1h;
        access_log off;
    }

    # Frappe protected files
    location ~ ^/protected/(.*) {
        internal;
        try_files /$mt_site/$1 =404;
    }

    error_page 502 /502.html;
    location /502.html {
        root /home/frappeuser/miniconda3/envs/frap/lib/python3.11/site-packages/bench/config/templates;
        internal;
    }

    access_log  /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 50m;
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;

    gzip on;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/font-woff
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;
}
