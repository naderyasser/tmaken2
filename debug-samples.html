<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فحص العينات - Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #45a049; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 فحص العينات المجانية</h1>

        <div>
            <label>اسم المندوب (Sales Person):</label>
            <input type="text" id="salesPerson" placeholder="مثال: SP-00001" style="width: 300px; padding: 8px; margin: 10px 0;">
        </div>

        <button onclick="checkAllocations()">1️⃣ فحص Allocations</button>
        <button onclick="checkAvailableSamples()">2️⃣ فحص Available Samples API</button>
        <button onclick="checkAllowedCustomers()">3️⃣ فحص Allowed Customers</button>

        <h3>النتائج:</h3>
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = '/api/frappe';

        async function callAPI(method, args = {}) {
            const params = new URLSearchParams({
                path: `/api/method/${method}`,
                ...Object.entries(args).reduce((acc, [k, v]) => {
                    acc[k] = v;
                    return acc;
                }, {})
            });

            const response = await fetch(`${API_BASE}?${params}`);
            const data = await response.json();
            return data;
        }

        function display(title, data, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.innerHTML = `
                <h4 class="${type}">${title}</h4>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            results.appendChild(div);
        }

        async function checkAllocations() {
            const salesPerson = document.getElementById('salesPerson').value;
            if (!salesPerson) {
                alert('من فضلك أدخل اسم المندوب');
                return;
            }

            document.getElementById('results').innerHTML = '<p>جاري التحميل...</p>';

            try {
                // Check raw allocations from database
                const query = `
                    SELECT
                        a.name,
                        a.item_code,
                        a.item_name,
                        a.status,
                        a.docstatus,
                        ar.sales_person,
                        ar.allocated_qty,
                        ar.distributed_qty,
                        ar.remaining_qty
                    FROM \`tabFree Sample Allocation Rep\` ar
                    JOIN \`tabFree Sample Allocation\` a ON a.name = ar.parent
                    WHERE ar.sales_person = '${salesPerson}'
                `;

                const result = await callAPI('frappe.client.get_list', {
                    doctype: 'Free Sample Allocation',
                    fields: ['name', 'item_code', 'item_name', 'status', 'docstatus'],
                    filters: JSON.stringify([]),
                    limit_page_length: 100
                });

                display('📋 جميع Allocations:', result, 'info');

                // Now check with filters
                const activeResult = await callAPI('frappe.client.get_list', {
                    doctype: 'Free Sample Allocation',
                    fields: ['name', 'item_code', 'item_name', 'status', 'docstatus'],
                    filters: JSON.stringify([['status', '=', 'Active']]),
                    limit_page_length: 100
                });

                display('✅ Active Allocations فقط:', activeResult, 'success');

            } catch (error) {
                display('❌ خطأ:', error.message, 'error');
            }
        }

        async function checkAvailableSamples() {
            const salesPerson = document.getElementById('salesPerson').value;
            if (!salesPerson) {
                alert('من فضلك أدخل اسم المندوب');
                return;
            }

            try {
                const result = await callAPI(
                    'base_meena.stock_management.doctype.free_sample_allocation.free_sample_allocation.get_available_samples',
                    { sales_person: salesPerson }
                );

                if (result.message && result.message.length > 0) {
                    display('✅ العينات المتاحة:', result.message, 'success');
                } else {
                    display('⚠️ لا توجد عينات متاحة', {
                        message: 'تحقق من: 1) اسم المندوب صحيح؟ 2) الـ allocation معمول Submit؟ 3) الـ status = Active؟ 4) remaining_qty > 0؟'
                    }, 'error');
                }
            } catch (error) {
                display('❌ خطأ في API:', error, 'error');
            }
        }

        async function checkAllowedCustomers() {
            const salesPerson = document.getElementById('salesPerson').value;
            if (!salesPerson) {
                alert('من فضلك أدخل اسم المندوب');
                return;
            }

            try {
                const result = await callAPI(
                    'base_meena.stock_management.doctype.free_sample_allocation.free_sample_allocation.get_allowed_customers',
                    { sales_person: salesPerson }
                );

                display('👥 العملاء المسموح بالتوزيع عليهم:', result.message, 'info');
            } catch (error) {
                display('❌ خطأ:', error, 'error');
            }
        }
    </script>
</body>
</html>
